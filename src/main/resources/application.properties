spring.application.name=bldizi
spring.profiles.active=dev

# --- ORTAK DB & HIBERNATE AYARLARI ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# --- PERFORMANCE TUNING ---
# 1. Java 23 Virtual Threads (Loom) for massive concurrency
spring.threads.virtual.enabled=true

# 2. Server HTTP GZIP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# 3. Connection Pool (HikariCP)
# Optimized pool sizing to prevent thread contention on SQL Server
spring.datasource.hikari.pool-name=HikariCP-BlDizi
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000

# 4. Static Resource Caching (Reduces repeated static asset requests)
spring.web.resources.chain.cache=true
spring.web.resources.cache.period=86400

# 5. Proxy Forward Headers
server.forward-headers-strategy=framework

# --- MAIL (E-POSTA) AYARLARI ---
spring.mail.host=mail.whodatidols.com
spring.mail.port=587
spring.mail.username=info@bldizi.com
spring.mail.password=${MAIL_PASSWORD:Sh218106,,}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- GEMINI AI VIBE SEARCH (En Ucuz & Hizli Surum: gemini-3.5-flash-lite) ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}

# Actuator Health Checks & Performance Metrics
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- WEB PUSH BİLDİRİMLERİ (VAPID) ---
# Güvenlik gereği VAPID_PRIVATE_KEY asla Git'e commit edilmemelidir.
# Ortam değişkeni (Environment Variable) veya /etc/bldizi.env üzerinden beslenir.
webpush.enabled=true
webpush.vapid.public-key=${VAPID_PUBLIC_KEY}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:admin@bldizi.com}

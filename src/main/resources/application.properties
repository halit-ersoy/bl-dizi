spring.application.name=bldizi
spring.profiles.active=dev

# --- ORTAK DB & HIBERNATE AYARLARI ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# --- CONNECTION POOL (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- PERFORMANCE TUNING ---
# 1. Java 23 Virtual Threads (Loom) for massive concurrency
spring.threads.virtual.enabled=true

# 2. Server GZIP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 3. Proxy Forward Headers
server.forward-headers-strategy=framework

# --- MAIL (E-POSTA) AYARLARI ---
spring.mail.host=mail.whodatidols.com
spring.mail.port=587
spring.mail.username=info@bldizi.com
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# IMAP Ayarları (Gelen Kutusu / Alma)
mail.imap.host=mail.whodatidols.com
mail.imap.port=993
mail.imap.username=info@bldizi.com
mail.imap.password=${MAIL_PASSWORD:}
mail.imap.ssl.enable=true

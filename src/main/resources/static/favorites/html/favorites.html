<!DOCTYPE html>
<html lang="tr" data-theme="pink">

<head>
    <meta name="robots" content="noindex, nofollow">
    <script src="/elements/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Favorilerim - BL Dizi</title>
    <meta name="description" content="İstek listelerinizde sakladığınız dizi ve film içerikleri.">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/elements/variables.css">
    <link rel="stylesheet" href="/favorites/css/favorites.css">
    <script src="/homepage/js/devtools-protection.js"></script>
</head>

<body>
    <!-- Subtle Ambient Lighting -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Minimal Header -->
    <header id="header">
        <a href="/" class="logo-link" aria-label="Ana sayfa">
            <div class="logo">BL DİZİ</div>
        </a>
    </header>

    <!-- Main Container -->
    <main class="favorites-main">
        <!-- Hero Header -->
        <section class="favorites-hero">
            <div class="favorites-hero-content">
                <div class="favorites-badge">
                    <i class="fas fa-heart"></i> Özel Koleksiyonlar
                </div>
                <h1 class="favorites-title">Favorilerim</h1>
                <p class="favorites-subtitle">
                    İzlemek istediğiniz veya beğendiğiniz içerikleri listeler halinde organize edin ve dilediğiniz an erişin.
                </p>
            </div>
            <div class="favorites-hero-actions">
                <button id="createListBtn" class="create-list-btn btn-primary-glow">
                    <i class="fas fa-plus-circle"></i> Yeni Liste Oluştur
                </button>
            </div>
        </section>

        <!-- Lists Container -->
        <div class="lists-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Listeleriniz yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- List Management Modal -->
    <div id="listManageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <div class="modal-icon-badge">
                        <i class="fas fa-bookmark"></i>
                    </div>
                    <h3>Listeyi Düzenle</h3>
                </div>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="editListName">Liste Adı</label>
                    <input type="text" id="editListName" placeholder="Liste adını giriniz" maxlength="100">
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel">İptal</button>
                    <button class="btn-save rename-list">Kaydet</button>
                    <button class="btn-delete">Listeyi Sil</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="/">Anasayfa</a>
            <a href="/about">Hakkımızda</a>
            <a href="/privacy_policy">Gizlilik Politikası</a>
            <a href="/terms_of_use">Kullanım Şartları</a>
            <a href="/sss">SSS</a>
        </div>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> BL Dizi. Tüm hakları saklıdır.</p>
    </footer>

    <script type="module" src="/favorites/js/favorites.js"></script>
</body>

</html>
